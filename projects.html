  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    (function() {
      var grid = document.getElementById('projects-grid');
      var searchEl = document.getElementById('project-search');
      var tagButtons = document.querySelectorAll('.filter-tag');
      var currentTag = '';
      var currentQuery = '';
      var projects = [];

      function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
      function render(list) {
        if (!grid) return;
        grid.innerHTML = list.map(function(p) {
          var links = (p.links || []).map(function(l) { return '<a href="' + escapeHtml(l.url || '#') + '" class="btn btn--outline" target="_blank" rel="noopener">' + escapeHtml(l.label || l.name) + '</a>'; }).join('');
          return '<div class="card' + (p.primary ? ' card--primary' : '') + '" data-tags="' + (p.tags || []).join(' ') + '" data-title="' + escapeHtml((p.title || p.name || '').toLowerCase()) + '">' +
            (p.image ? '<img src="' + escapeHtml(p.image) + '" alt="" class="card__image" loading="lazy">' : '') +
            '<h3 class="card__title">' + escapeHtml(p.title || p.name) + '</h3>' +
            (p.meta ? '<p class="card__meta">' + escapeHtml(p.meta) + '</p>' : '') +
            (p.description ? '<p class="card__text">' + escapeHtml(p.description) + '</p>' : '') +
            (links ? '<div class="card__actions">' + links + '</div>' : '') + '</div>';
        }).join('');
      }
      function filter() {
        var q = (currentQuery || '').trim().toLowerCase();
        var tag = (currentTag || '').toLowerCase();
        var list = projects.filter(function(p) {
          var matchTag = !tag || (p.tags || []).some(function(t) { return t.toLowerCase() === tag; });
          var matchQ = !q || (p.title || '').toLowerCase().indexOf(q) >= 0 || (p.description || '').toLowerCase().indexOf(q) >= 0;
          return matchTag && matchQ;
        });
        render(list);
      }
      function loadProjects() {
        var inlineEl = document.getElementById('inline-projects');
        if (inlineEl && inlineEl.textContent) {
          try {
            var data = JSON.parse(inlineEl.textContent.trim());
            projects = data.projects || data.items || (Array.isArray(data) ? data : []);
            filter();
            return;
          } catch (e) {}
        }
        if (window.loadData) {
          window.loadData('projects', 'data/projects.json', function(data) {
            projects = Array.isArray(data) ? data : (data.projects || data.items || []);
            filter();
          });
        } else {
          fetch('data/projects.json').then(function(r) { return r.json(); }).then(function(data) {
            projects = data.projects || data.items || [];
            filter();
          }).catch(function() {
            projects = [];
            filter();
          });
        }
      }
      loadProjects();
      if (searchEl) searchEl.addEventListener('input', function() { currentQuery = this.value; filter(); });
      tagButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          tagButtons.forEach(function(b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          currentTag = btn.getAttribute('data-tag') || '';
          filter();
        });
      });
    })();
  </script>
