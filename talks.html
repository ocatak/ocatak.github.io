  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    (function() {
      var container = document.getElementById('talks-by-year');
      if (!container) return;
      function load() {
        var inline = document.getElementById('inline-talks');
        var data = [];
        if (inline && inline.textContent) try { data = JSON.parse(inline.textContent).talks || []; } catch (e) {}
        fetch('data/talks.json').then(function(r) { return r.json(); }).then(function(d) {
          data = d.talks || d.items || d || [];
          render(data);
        }).catch(function() {
          if (inline && inline.textContent) try { data = JSON.parse(inline.textContent).talks || []; } catch (e) {}
          render(data);
        });
      }
      function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
      function render(talks) {
        var byYear = {};
        talks.forEach(function(t) {
          var dateStr = t.date || t.year || '';
          var yearMatch = dateStr && dateStr.match(/\d{4}/);
          var y = yearMatch ? parseInt(yearMatch[0], 10) : 'Other';
          if (!byYear[y]) byYear[y] = [];
          byYear[y].push(t);
        });
        var years = Object.keys(byYear).filter(function(k) { return k !== 'Other'; }).map(Number).sort(function(a, b) { return b - a; });
        if (byYear['Other']) years = years.concat(['Other']);
        var icon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>';
        container.innerHTML = years.map(function(year) {
          var items = byYear[year].map(function(t) {
            var links = (t.links || []).map(function(l) { return '<a href="' + escapeHtml(l.url || '#') + '" class="btn btn--outline" target="_blank" rel="noopener">' + escapeHtml(l.label || l.name) + '</a>'; }).join('');
            return '<div class="talk-item">' + '<span class="talk-item__icon">' + icon + '</span>' +
              '<div><div class="talk-item__title">' + escapeHtml(t.title || t.name) + '</div>' +
              '<div class="talk-item__meta">' + escapeHtml(t.venue || '') + (t.date ? ' · ' + t.date : '') + '</div>' +
              (links ? '<div class="card__actions mt-2">' + links + '</div>' : '') + '</div></div>';
          }).join('');
          return '<h2 style="margin-top: 2rem;">' + escapeHtml(year) + '</h2>' + items;
        }).join('');
      }
      document.addEventListener('DOMContentLoaded', load);
    })();
  </script>
